[package]
name = "grime_pj"
version = "1.1.0"
edition = "2021"
description = "Высокопроизводительный системный оркестратор проектов, контейнеров и эфемерных Nix-окружений на стыке Rust и Lua 5.4"

[lib]
name = "grime"
path = "src/lib.rs"

[[bin]]
name = "grime"
path = "src/bin/grime.rs"

[dependencies]
mlua = { version = "0.10", features = ["lua54", "vendored", "send"] }
tokio = { version = "1.38", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bytes = "1.0"
notify = "6.1"
fuzzy-matcher = "0.3"
colored = "2.1"
shellexpand = "3.1"
libc = "0.2"
dirs = "5.0"
walkdir = "2.5"
rmp-serde = "1.3"
rmpv = { version = "1.3", features = ["with-serde"] }


[profile.release]
lto = "fat"
codegen-units = 1
strip = true
# panic = "abort" НЕ включаем: демон перехватывает паники в spawn_blocking
